<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Oracle Redemption - 現代武器一覧</title>
<link rel="stylesheet" href="css/style.css">

<style>
  .weapon-category {
    margin: 40px 0;
  }
  .weapon-category h2 {
    margin-bottom: 10px;
    border-bottom: 1px solid #ccc;
    padding-bottom: 4px;
  }
  .card {
    border: 1px solid #444;
    border-radius: 6px;
    padding: 10px 14px;
    margin: 8px 0;
    background: #111;
    color: #eee;
  }
  .card h3 {
    margin: 0 0 6px;
    font-size: 1.1rem;
  }
  .card p {
    margin: 4px 0;
  }
</style>
</head>

<body>
<nav>
  <a href="index.html">トップ</a>
  <a href="worldview.html">世界観</a>
  <a href="ability.html">能力</a>
  <a href="makers.html">メーカー</a>
  <a href="gallery.html">ギャラリー</a>
  <a href="buki.html">武器</a>
</nav>

<div class="container">
  <h1>現代武器一覧</h1>
  <p>ここに現代武器の説明を貼る。</p>

  <!-- ▼▼▼ APIで自動生成されるカテゴリ ▼▼▼ -->
  <section class="weapon-category" id="pistol">
    <h2>ピストル</h2>
  </section>

  <section class="weapon-category" id="pistol">
    <h2>特殊ピストル</h2>
  </section>
  
  <section class="weapon-category" id="smg">
    <h2>サブマシンガン</h2>
  </section>

  <section class="weapon-category" id="rifle">
    <h2>ライフル</h2>
  </section>

  <section class="weapon-category" id="shotgun">
    <h2>ショットガン</h2>
  </section>

  <section class="weapon-category" id="lmg">
    <h2>ライトマシンガン</h2>
  </section>

  <section class="weapon-category" id="cannon">
    <h2>キャノン</h2>
  </section>
  <!-- ▲▲▲ 必要なら他カテゴリも追加 ▲▲▲ -->

</div>

<footer>© Oracle Redemption Project</footer>

<script>
async function loadModernWeaponsDB() {
  const url = "https://script.google.com/macros/s/AKfycbwFh-3eK7n73eJH4FwFqcExXRVQSyRXNvg608ch1ttPS6RbOb2Tkw5madxwLks3eE4H/exec";

  let data;
  try {
    const res = await fetch(url);
    data = await res.json();
  } catch (e) {
    console.error("API取得エラー:", e);
    return;
  }

  data.forEach(w => {
    const box = document.getElementById(w.category);
    if (!box) return;

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <h3>《${w.name}》</h3>
      <p><strong>装弾：</strong>${w.ammo || "ー"}</p>
      <p><strong>威力：</strong>${w.power || "ー"}</p>
      <p><strong>効果：</strong><br>${(w.effect || "ー").replace(/\n/g, "<br>")}</p>
      <p><strong>耐久：</strong>${w.durability || "ー"}</p>
    `;

    box.appendChild(card);
  });
}

loadModernWeaponsDB();
</script>

</body>
</html>
