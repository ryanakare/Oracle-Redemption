<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Oracle Redemption - 武器一覧</title>
<link rel="stylesheet" href="css/style.css">

<style>
  .weapon-category {
    margin: 40px 0;
  }
  .weapon-category h2 {
    margin-bottom: 10px;
    border-bottom: 1px solid #ccc;
    padding-bottom: 4px;
  }
  .card {
    border: 1px solid #444;
    border-radius: 6px;
    padding: 10px 14px;
    margin: 8px 0;
    background: #111;
    color: #eee;
  }
  .card h3 {
    margin: 0 0 6px;
    font-size: 1.1rem;
  }
  .card p {
    margin: 4px 0;
  }

  /* トグル */
  .group-toggle {
    margin: 20px 0;
    padding: 10px 16px;
    background: #222;
    color: #eee;
    border: 1px solid #555;
    border-radius: 4px;
    cursor: pointer;
    font-size: 1rem;
  }

  /* ボタン */
  .category-buttons {
    margin: 20px 0;
  }
  .category-buttons button {
    margin: 4px;
    padding: 8px 14px;
    background: #222;
    color: #eee;
    border: 1px solid #555;
    border-radius: 4px;
    cursor: pointer;
  }
  .category-buttons button:hover {
    background: #444;
  }
</style>
</head>

<body>
<nav>
  <a href="index.html">トップ</a>
  <a href="worldview.html">世界観</a>
  <a href="ability.html">能力</a>
  <a href="makers.html">メーカー</a>
  <a href="gallery.html">ギャラリー</a>
  <a href="buki.html">武器</a>
</nav>

<div class="container">
  <h1>武器一覧</h1>
  <p>ここに現代武器の説明を貼る。</p>

  <!-- ▼▼▼ 現代武器トグル ▼▼▼ -->
  <button class="group-toggle" onclick="toggleGroup()">▶ 現代武器</button>

  <div id="modern-weapons" style="display:none; margin-top:20px;">

    <!-- ▼▼▼ カテゴリボタン ▼▼▼ -->
    <div class="category-buttons">
      <button onclick="showCategory('pistol')">ピストル</button>
      <button onclick="showCategory('special')">特殊ピストル</button>
      <button onclick="showCategory('smg')">サブマシンガン</button>
      <button onclick="showCategory('rifle')">ライフル</button>
      <button onclick="showCategory('shotgun')">ショットガン</button>
      <button onclick="showCategory('lmg')">ライトマシンガン</button>
      <button onclick="showCategory('cannon')">キャノン</button>
      <button onclick="showCategory('all')">全て表示</button>
    </div>

    <!-- ▼▼▼ APIで自動生成されるカテゴリ ▼▼▼ -->
    <section class="weapon-category" id="pistol">
      <h2>ピストル</h2>
    </section>

    <section class="weapon-category" id="special">
      <h2>特殊ピストル</h2>
    </section>
    
    <section class="weapon-category" id="smg">
      <h2>サブマシンガン</h2>
    </section>

    <section class="weapon-category" id="rifle">
      <h2>ライフル</h2>
    </section>

    <section class="weapon-category" id="shotgun">
      <h2>ショットガン</h2>
    </section>

    <section class="weapon-category" id="lmg">
      <h2>ライトマシンガン</h2>
    </section>

    <section class="weapon-category" id="cannon">
      <h2>キャノン</h2>
    </section>
</div>
  </div>

<!-- ▼▼▼ 古代武器トグル ▼▼▼ -->
<button class="group-toggle" onclick="toggleAncient()">▶ 古代武器</button>

<div id="ancient-weapons" style="display:none; margin-top:20px;">

  <!-- ▼▼▼ 古代武器カテゴリボタン ▼▼▼ -->
  <div class="category-buttons">
    <button onclick="showAncientCategory('ancient_pistol')">古代ピストル</button>
    <button onclick="showAncientCategory('ancient_special')">古代特殊ピストル</button>
    <button onclick="showAncientCategory('ancient_smg')">古代サブマシンガン</button>
    <button onclick="showAncientCategory('ancient_shotgun')">古代ショットガン</button>
    <button onclick="showAncientCategory('ancient_double')">古代ダブルバレル</button>
    <button onclick="showAncientCategory('ancient_assault')">古代アサルトライフル</button>
    <button onclick="showAncientCategory('ancient_sniper')">古代スナイパーライフル</button>
    <button onclick="showAncientCategory('ancient_lmg')">古代ライトマシンガン</button>
    <button onclick="showAncientCategory('ancient_bazooka')">古代バズーカ</button>
    <button onclick="showAncientCategory('ancient_grenade')">古代グレポン</button>
    <button onclick="showAncientCategory('all')">全て表示</button>
  </div>

  <!-- ▼▼▼ 古代武器カテゴリ（APIで自動生成） ▼▼▼ -->
  <section class="weapon-category" id="ancient_pistol">
    <h2>古代ピストル</h2>
  </section>
  
  <section class="weapon-category" id="ancient_special">
    <h2>古代特殊ピストル</h2>
  </section>
  
  <section class="weapon-category" id="ancient_smg">
    <h2>古代サブマシンガン</h2>
  </section>
  
  <section class="weapon-category" id="ancient_shotgun">
    <h2>古代ショットガン</h2>
  </section>
  
  <section class="weapon-category" id="ancient_double">
    <h2>古代ダブルバレル</h2>
  </section>
  
  <section class="weapon-category" id="ancient_assault">
    <h2>古代アサルトライフル</h2>
  </section>
  
  <section class="weapon-category" id="ancient_sniper">
    <h2>古代スナイパーライフル</h2>
  </section>
  
  <section class="weapon-category" id="ancient_lmg">
    <h2>古代ライトマシンガン</h2>

  <section class="weapon-category" id="ancient_bazooka">

  <section class="weapon-category" id="ancient_grenade">

  </section>
  

</div>

  
<footer>© Oracle Redemption Project</footer>

<script>
/* ▼▼▼ トグル ▼▼▼ */
function toggleGroup() {
  const box = document.getElementById('modern-weapons');
  const btn = document.querySelector('.group-toggle');
  if (box.style.display === 'none') {
    box.style.display = 'block';
    btn.textContent = '▼ 現代武器';
  } else {
    box.style.display = 'none';
    btn.textContent = '▶ 現代武器';
  }
}
  
function toggleAncient() {
  const box = document.getElementById('ancient-weapons');
  const btn = document.querySelector('button[onclick="toggleAncient()"]');
  if (box.style.display === 'none') {
    box.style.display = 'block';
    btn.textContent = '▼ 古代武器';
  } else {
    box.style.display = 'none';
    btn.textContent = '▶ 古代武器';
  }
}
  
/* ▼▼▼ API読み込み ▼▼▼ */
async function loadModernWeaponsDB() {
  const url = "https://script.google.com/macros/s/AKfycbyjqSb8TywQ2FQs6dc4p3XU2aHOmtlSSMFE8F2QNeos5ZoOpdmdO55qEwfHvdNqmh13/exec";

  let data;
  try {
    const res = await fetch(url);
    data = await res.json();
  } catch (e) {
    console.error("API取得エラー:", e);
    return;
  }

  data.forEach(w => {
    const box = document.getElementById(w.category);
    if (!box) return;

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <h3>《${w.name}》</h3>
      <p><strong>装弾：</strong>${w.ammo || "ー"}</p>
      <p><strong>威力：</strong>${w.power || "ー"}</p>
      <p><strong>効果：</strong><br>${(w.effect || "ー").replace(/\n/g, "<br>")}</p>
      <p><strong>耐久：</strong>${w.durability || "ー"}</p>
    `;

    box.appendChild(card);
  });
}  

loadModernWeaponsDB();

async function loadAncientWeaponsDB() {
  const url = "https://script.google.com/macros/s/AKfycbxL7EgSt9n9XNUeIpwaEPjHwaMKZiexDhEVgEZxdvHqRX3AJMJb2LvIGmHtfFPxT8I/exec";

  let data;
  try {
    const res = await fetch(url);
    data = await res.json();
  } catch (e) {
    console.error("古代武器API取得エラー:", e);
    return;
  }

  data.forEach(w => {
    const box = document.getElementById(w.category);
    if (!box) return;

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <h3>《${w.name}》</h3>
      <p><strong>装弾：</strong>${w.ammo || "ー"}</p>
      <p><strong>威力：</strong>${w.power || "ー"}</p>
      <p><strong>効果：</strong><br>${(w.effect || "ー").replace(/\n/g, "<br>")}</p>
      <p><strong>耐久：</strong>${w.durability || "ー"}</p>
    `;

    box.appendChild(card);
  });
}

loadAncientWeaponsDB();
  
/* ▼▼▼ カテゴリ表示切り替え ▼▼▼ */
function showCategory(cat) {
  const cats = document.querySelectorAll('#modern-weapons .weapon-category');

  if (cat === "all") {
    cats.forEach(c => c.style.display = "block");
    return;
  }

  cats.forEach(c => {
    if (c.id === cat) {
      c.style.display = "block";
    } else {
      c.style.display = "none";
    }
  });
}

function showAncientCategory(cat) {
  const cats = document.querySelectorAll('#ancient-weapons .weapon-category');

  if (cat === "all") {
    cats.forEach(c => c.style.display = "block");
    return;
  }

  cats.forEach(c => {
    if (c.id === cat) {
      c.style.display = "block";
    } else {
      c.style.display = "none";
    }
  });
}  
</script>

</body>
</html>
