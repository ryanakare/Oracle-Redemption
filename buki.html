<!DOCTYPE html>

<style>
  .tabs {
    display: flex;
    gap: 10px;
    margin: 20px 0;
  }
  .tab {
    padding: 10px 16px;
    background: #222;
    color: #eee;
    border: 1px solid #555;
    border-radius: 4px;
    cursor: pointer;
  }
  .tab.active {
    background: #444;
    border-color: #888;
  }

  .weapon-category {
    margin: 40px 0;
  }
  .weapon-category h2 {
    margin-bottom: 10px;
    border-bottom: 1px solid #ccc;
    padding-bottom: 4px;
  }
  .card {
    border: 1px solid #444;
    border-radius: 6px;
    padding: 10px 14px;
    margin: 8px 0;
    background: #111;
    color: #eee;
  }
  .card h3 {
    margin: 0 0 6px;
    font-size: 1.1rem;
  }
  .card p {
    margin: 4px 0;
  }

  .category-buttons {
    margin: 20px 0;
  }
  .category-buttons button {
    margin: 4px;
    padding: 8px 14px;
    background: #222;
    color: #eee;
    border: 1px solid #555;
    border-radius: 4px;
    cursor: pointer;
  }
  .category-buttons button:hover {
    background: #444;
  }
</style>
</head>

      <button onclick="showSpecialCategory('special_magic')">魔術武器</button>
      <button onclick="showSpecialCategory('special_support')">支援特殊武器</button>

    <section class="weapon-category" id="special_melee"><h2>近接特殊武器</h2></section>

</div>

<script>
function switchTab(tab) {
  document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
  document.getElementById(tab).style.display = 'block';

  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab[onclick="switchTab('${tab}')"]`).classList.add('active');
}

/* 現代武器API */
async function loadModernWeaponsDB() {
  const url = "https://script.google.com/macros/s/AKfycbyjqSb8TywQ2FQs6dc4p3XU2aHOmtlSSMFE8F2QNeos5ZoOpdmdO55qEwfHvdNqmh13/exec";
  const res = await fetch(url);
  const data = await res.json();

  data.forEach(w => {
    const box = document.getElementById(w.category);
    if (!box) return;
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <h3>《${w.name}》</h3>
      <p><strong>装弾：</strong>${w.ammo || "ー"}</p>
      <p><strong>威力：</strong>${w.power || "ー"}</p>
      <p><strong>効果：</strong><br>${(w.effect || "ー").replace(/\n/g, "<br>")}</p>
      <p><strong>耐久：</strong>${w.durability || "ー"}</p>
    `;
    box.appendChild(card);
  });
}
loadModernWeaponsDB();

/* カテゴリ切り替え */
function showCategory(cat) {
  const cats = document.querySelectorAll('#modern .weapon-category');
  cats.forEach(c => c.style.display = (cat === "all" || c.id === cat) ? "block" : "none");
}

function showAncientCategory(cat) {
  const cats = document.querySelectorAll('#ancient .weapon-category');
  cats.forEach(c => c.style.display = (cat === "all" || c.id === cat) ? "block" : "none");
}
